<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>1. FC Zdorf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/root.css">
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>

    <header class="hero" id="top">
        <nav>
            <div class="wrap">
                <a class="brand" href="#top" aria-label="1. FC Zdorf home">
                    <img class="crest" src="./assets/FC Zdorf Logo Transparent.png" alt="">
                    1. FC Zdorf
                </a>
                <ul>
                    <li><a href="./news.html">News</a></li>
                    <li><a href="#players">Players</a></li>
                    <li><a href="#table">Table</a></li>
                    <li><a href="#join">Join</a></li>
                </ul>
                <a class="btn btn-white" href="./tickets.html">Tickets</a>
            </div>
        </nav>

        <div class="hero-body">
            <div class="wrap">
                <h1><small>1. FC</small><span>Zdorf</span></h1>
                <p class="lead"></p>
                <div class="cta">
                    <a class="btn btn-white" href="./tickets.html">Get match tickets</a>
                    <a class="btn btn-ghost" href="#table">See results</a>
                </div>
            </div>
        </div>

        <div class="matchbar" id="tickets" hidden>
            <div class="wrap">
                <b>Next match</b>
                <div class="teams"></div>
                <time></time>
            </div>
        </div>
    </header>

    <main>
        <section class="block" id="news">
            <div class="wrap">
                <h2>Latest news</h2>
                <div class="news" id="home-news" aria-live="polite"></div>
                <p style="margin-top:2rem"><a class="btn btn-red" href="./news.html">All news</a></p>
            </div>
        </section>

        <section class="block" id="players">
            <div class="wrap">
                <h2>Players</h2>
                <div class="players-track" tabindex="0" aria-label="Player cards"></div>
                <div class="players-dots" role="group" aria-label="Player carousel position"></div>
            </div>
        </section>

        <section class="block alt" id="table">
            <div class="wrap">
                <div>
                    <h2>Recent results</h2>
                    <div id="results"></div>
                </div>
            </div>
        </section>

        <section class="block join" id="join">
            <div class="wrap">
                <h2>Play for Zdorf</h2>
                <p>We're looking for anyone to join the club!
                </p>
                <a class="btn btn-white" href="mailto:fc.zdorf@gmail.com">Join</a>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap">
            <span>© 2026 1. FC Zdorf e.V.</span>
        </div>
    </footer>

</body>

<script src="./js/index.js"></script>

</html>
